<!-- ============================================================
     INICIO DE LA PLANTILLA
     ============================================================
     Inicio de la plantilla login.html.
-->
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <!-- ===========================================
         SECCIÓN 1 Metadatos y recursos
         =========================================== -->
    <meta charset="UTF-8">
    <title>Inicio de Sesión</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/login.css}">
</head>
<body class="d-flex align-items-center justify-content-center vh-100">

    <!-- ===========================================
         SECCIÓN 2 Contenedor principal
         =========================================== -->
    <div class="card shadow p-4 login-card">
        <!-- ===========================================
             SECCIÓN 3 Encabezado dentro de la tarjeta
             =========================================== -->
        <div class="text-center mb-4">
            <h2 class="fw-bold text-green">Inicio de Sesión</h2>
            <p class="text-muted">Ingresa tus credenciales</p>
        </div>
        
        <!-- ===========================================
             SECCIÓN 4 Formulario de inicio de sesión
             =========================================== -->
        <form id="loginForm" th:action="@{/login}" method="POST">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <div class="mb-3">
                <label for="username" class="form-label">Usuario</label>
                <input type="text" class="form-control" id="username" name="username" required>
            </div>
            <div class="mb-4">
                <label for="password" class="form-label">Contraseña</label>
                <input type="password" class="form-control" id="password" name="password" placeholder="••••••" required>
            </div>
            <button type="submit" class="btn btn-green w-100 fw-bold">Ingresar</button>
        </form>

        <!-- ===========================================
             SECCIÓN 5 Mensajes de estado y error
             =========================================== -->
        <div id="mensajeError" class="alert alert-danger mt-3 d-none text-center" role="alert">
            Por favor completa todos los campos
        </div>

        <div th:if="${param.error}" class="alert alert-danger mt-3 text-center" role="alert">
            Usuario o contraseña incorrectos.
        </div>

        <div th:if="${param.logout}" class="alert alert-success mt-3 text-center" role="alert">
            Has cerrado sesión exitosamente.
        </div>
    </div>

    <!-- ===========================================
         SECCIÓN 6 Scripts
         =========================================== -->
    <script th:src="@{/js/login.js}"></script>
</body>
</html>
<!-- Fin de la plantilla login.html. -->
