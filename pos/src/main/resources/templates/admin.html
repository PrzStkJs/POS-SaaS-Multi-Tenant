<!--
============================================================
     PROYECTO: Sistema POS BarCodeSys - Módulo de Administración
     DESCRIPCIÓN: Plantilla Thymeleaf encargada de presentar la vista principal de admin para el
                  usuario.

     @author Jesús Alexander Perez Huacaychuco
     @version 1.0.0
     @date 03/08/2026
============================================================
-->

<!-- ============================================================
     INICIO DE LA PLANTILLA
     ============================================================
     Inicio de la plantilla admin.html.
-->
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <!-- ===========================================
         SECCIÓN 1: Metadatos y recursos
         =========================================== -->
    <meta charset="UTF-8">
    <meta name="_csrf" th:content="${_csrf.token}">
    <meta name="_csrf_header" th:content="${_csrf.headerName}">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Administración</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/admin.css}">
</head>
<body>

    <!-- ===========================================
         SECCIÓN 2: Barra superior móvil
         =========================================== -->
    <nav class="navbar navbar-light bg-white shadow-sm d-lg-none">
        <div class="container-fluid">
            <button class="btn btn-green" type="button" data-bs-toggle="offcanvas" data-bs-target="#sidebarMenu">
                <i class="bi bi-list"></i>
            </button>
            <span class="fw-bold text-green">Panel Admin</span>
        </div>
    </nav>

    <!-- ===========================================
         SECCIÓN 3: Offcanvas (sidebar) para móvil
         =========================================== -->
    <div class="offcanvas offcanvas-start" tabindex="-1" id="sidebarMenu">
        <div class="offcanvas-header bg-green text-white">
            <h5 class="offcanvas-title"><i class="bi bi-speedometer2 me-2"></i>Admin</h5>
            <button type="button" class="btn-close btn-close-white" data-bs-dismiss="offcanvas"></button>
        </div>
        <div class="offcanvas-body p-0 pt-3">
            <a class="sidebar-link active" href="#" data-vista="dashboard"><i class="bi bi-house-door"></i>Dashboard</a>
            <a class="sidebar-link" href="#" data-vista="productos"><i class="bi bi-box-seam"></i>Productos</a>
            <a class="sidebar-link" href="#" data-vista="stock"><i class="bi bi-boxes"></i>Stock</a>
            <a class="sidebar-link" href="#" data-vista="ventas"><i class="bi bi-graph-up"></i>Ventas</a>
            <a class="sidebar-link" href="#" data-vista="analitica"><i class="bi bi-stars text-warning"></i>Analítica IA</a>
            <a class="sidebar-link" href="#" data-vista="promociones"><i class="bi bi-tags-fill text-success"></i>Promociones IA</a>
            <a class="sidebar-link" href="#" data-vista="usuarios"><i class="bi bi-people"></i>Usuarios</a>
			
            <div class="border-top pt-2 mt-auto">
                <a class="sidebar-link text-danger" href="/logout"><i class="bi bi-box-arrow-right"></i>Salir</a>
            </div>
        </div>
    </div>

    <!-- ===========================================
         SECCIÓN 4: Sidebar fijo en escritorio
         =========================================== -->
    <aside class="sidebar-desktop d-none d-lg-flex flex-column">
        <div class="text-center py-4 border-bottom">
            <h5 class="fw-bold text-green mb-0"><i class="bi bi-speedometer2 me-2"></i>Admin</h5>
        </div>
        <nav class="flex-grow-1 pt-3">
            <a class="sidebar-link active" href="#" data-vista="dashboard"><i class="bi bi-house-door"></i>Dashboard</a>
            <a class="sidebar-link" href="#" data-vista="productos"><i class="bi bi-box-seam"></i>Productos</a>
            <a class="sidebar-link" href="#" data-vista="stock"><i class="bi bi-boxes"></i>Stock</a>
            <a class="sidebar-link" href="#" data-vista="ventas"><i class="bi bi-graph-up"></i>Ventas</a>
            <a class="sidebar-link" href="#" data-vista="analitica"><i class="bi bi-stars text-warning"></i>Analítica IA</a>
            <a class="sidebar-link" href="#" data-vista="promociones"><i class="bi bi-tags-fill text-success"></i>Promociones IA</a>
            <a class="sidebar-link" href="#" data-vista="usuarios"><i class="bi bi-people"></i>Usuarios</a>
        </nav>
        <div class="border-top pt-2 pb-3 px-2">
            <a class="sidebar-link text-danger" href="/logout"><i class="bi bi-box-arrow-right"></i>Salir</a>
        </div>
    </aside>

    <!-- ===========================================
         SECCIÓN 5: Contenedor principal para vistas dinámicas
         =========================================== -->
    <div class="main-content" id="contenedor-vistas">
    </div>

    <!-- ===========================================
         SECCIÓN 6: Librerías externas
         =========================================== -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.3.0/exceljs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
	<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script th:src="@{/js/security.js}"></script>

    <!-- ===========================================
         SECCIÓN 7: Scripts de vistas y módulos
         =========================================== -->
    <script th:src="@{/js/admin-dashboard.js}"></script>
    <script th:src="@{/js/admin-productos.js}"></script>
    <script th:src="@{/js/admin-stock.js}"></script>
    <script th:src="@{/js/admin-ventas.js}"></script>
    <script th:src="@{/js/admin-analitica.js}"></script>
    <script th:src="@{/js/admin-promociones.js}"></script>
    <script th:src="@{/js/admin-usuarios.js}"></script>

    <!-- ===========================================
         SECCIÓN 8: Librerías adicionales para export/visualización
         =========================================== -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <script src="https://npmcdn.com/flatpickr/dist/l10n/es.js"></script>

    <!-- ===========================================
         SECCIÓN 9: Script principal del panel (inicialización y navegación)
         =========================================== -->
    <script th:src="@{/js/admin.js}"></script>
</body>
</html>
<!-- Fin de la plantilla admin.html. -->
