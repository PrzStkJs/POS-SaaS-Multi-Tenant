<!--

     PROYECTO: Sistema POS BarCodeSys - Módulo de Ventas
     DESCRIPCIÓN: Plantilla Thymeleaf encargada de presentar la vista principal de ventas para el
                  usuario.

     @author Jesús Alexander Perez Huacaychuco
     @version 1.0.0
     @date 03/08/2026
============================================================
-->

<!-- ============================================================
     INICIO DE LA PLANTILLA
     ============================================================
     Inicio de la plantilla ventas.html.
-->
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="_csrf" th:content="${_csrf.token}">
    <meta name="_csrf_header" th:content="${_csrf.headerName}">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cajero - Punto de Venta</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/ventas.css}">

</head>
<body class="bg-light-green">

    <!-- Barra superior -->
    <nav class="navbar bg-white shadow-sm mb-3">
        <div class="container-fluid">
            <span class="navbar-brand fw-bold text-green">
                <i class="bi bi-cart3 me-2"></i>Cajero - Punto de Venta
            </span>
            <button class="btn btn-outline-green" data-bs-toggle="modal" data-bs-target="#modalProductoRapido">
                <i class="bi bi-lightning-charge me-1"></i>Producto Rápido
            </button>
        </div>
    </nav>

    <div class="container-fluid">
        <div class="row g-3">
            <!-- Panel izquierdo: lista de productos -->
            <div class="col-lg-8">
                <div class="card shadow-sm">
                    <div class="card-header bg-white d-flex justify-content-between align-items-center">
                        <h5 class="mb-0 text-green"><i class="bi bi-list-ul me-2"></i>Productos en Venta</h5>
                        <span class="badge bg-green" id="contadorItems">0</span>
                    </div>
                    <div class="card-body p-0">
                        <div class="table-responsive" style="max-height: 60vh; overflow-y: auto;">
                            <table class="table table-hover mb-0">
                                <thead class="table-light sticky-top">
                                    <tr>
                                        <th>Código</th>
                                        <th>Producto</th>
                                        <th class="text-end">Precio</th>
                                        <th class="text-center">Cant.</th>
                                        <th class="text-end">Subtotal</th>
                                        <th></th>
                                    </tr>
                                </thead>
                                <tbody id="listaProductos">
                                    <tr id="filaVacia">
                                        <td colspan="6" class="text-center text-muted py-4">
                                            <i class="bi bi-inbox display-5 d-block mb-2"></i>
                                            Escanea o busca un producto
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                    <div class="card-footer bg-white">
                        <div class="input-group">
                            <input type="text" id="inputCodigo" class="form-control" placeholder="Escanea código de barras (producto del sistema)" autofocus>
                            <button class="btn btn-green" type="button" id="btnAgregarManual"><i class="bi bi-search"></i></button>
                        </div>
                    </div>
                </div>
                <!-- Bloque de sugerencia inteligente (cross-selling) -->
                <div class="card shadow-sm mt-3 border-warning d-none" id="panelCrossSelling">
                    <div class="card-header bg-warning bg-opacity-25 border-warning d-flex justify-content-between align-items-center py-2">
                        <h6 class="mb-0 text-dark fw-bold">
                            <i class="bi bi-stars text-warning me-2"></i>Sugerencia Inteligente
                        </h6>
                        <span class="badge bg-dark">Atajo: F4</span>
                    </div>
                    <div class="card-body d-flex align-items-center justify-content-between py-2">
                        <div>
                            <p class="mb-0 text-muted small">Dile al cliente:</p>
                            <h5 class="mb-0 fw-bold text-dark" id="textoScriptVenta">"¿Desea agregar una xxx"</h5>
                        </div>
                        <button class="btn btn-warning fw-bold px-4 shadow-sm" id="btnAgregarSugerencia">
                            <i class="bi bi-plus-circle me-1"></i>Agregar [F4]
                        </button>
                    </div>
                </div>
            </div>

            <!-- Panel derecho: resumen y total -->
            <div class="col-lg-4">
                <div class="card shadow-sm">
                    <div class="card-header bg-green text-white">
                        <h5 class="mb-0"><i class="bi bi-receipt me-2"></i>Resumen</h5>
                    </div>
                    <div class="card-body">
                        <div id="listaResumen" class="mb-3" style="max-height: 40vh; overflow-y: auto;">
                        </div>

                        <div class="d-flex justify-content-between mb-2">
                            <span>Subtotal</span>
                            <span id="subtotal">S/. 0.00</span>
                        </div>
                        <div class="d-flex justify-content-between mb-2">
                            <span>IGV (18%)</span>
                            <span id="igv">S/. 0.00</span>
                        </div>
                        <hr>
                        <div class="d-flex justify-content-between fw-bold fs-5">
                            <span>Total</span>
                            <span id="total" class="text-green">S/. 0.00</span>
                        </div>
                    </div>
                    <div class="card-footer bg-white d-grid gap-2">
                        <button class="btn btn-green btn-lg" id="btnCobrar" disabled>
                            <i class="bi bi-cash-coin me-2"></i>Cobrar
                        </button>
                        <button class="btn btn-outline-danger" id="btnCancelarVenta">
                            <i class="bi bi-x-circle me-1"></i>Cancelar Venta
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div th:replace="~{fragmentos/ventas-modales :: modalesVenta}"></div>
    <div th:replace="~{fragmentos/ventas-ticket :: ticketImpresion}"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script th:src="@{/js/security.js}"></script>
    <script type="module" th:src="@{/js/ventas.js}"></script>
</body>
</html>
<!-- Fin de la plantilla ventas.html. -->
