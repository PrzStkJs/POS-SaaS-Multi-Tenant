<!--
============================================================
     PROYECTO: Sistema POS BarCodeSys - Módulo de Inventario y Productos
     DESCRIPCIÓN: Fragmento Thymeleaf reutilizable encargado de renderizar la sección de
                  productos en la interfaz.

     @author Jesús Alexander Perez Huacaychuco
     @version 1.0.0
     @date 03/08/2026
============================================================
-->

<!-- ============================================================
     INICIO DE LA PLANTILLA
     ============================================================
     Inicio de la plantilla productos.html.
-->
<div class="d-flex justify-content-between align-items-center mb-3">
    <h4 class="text-green fw-bold"><i class="bi bi-box-seam me-2"></i>Productos</h4>
    <button class="btn btn-green" id="btnNuevoProducto" data-bs-toggle="modal" data-bs-target="#modalNuevoProducto">
        <i class="bi bi-plus-circle me-1"></i>Nuevo Producto
    </button>
</div>

<div class="card shadow-sm">
    <!-- HEADER MODIFICADO: Buscador, Filtros y Botón Excel -->
    <div class="card-header bg-white d-flex flex-wrap gap-2 justify-content-between align-items-center">
        
        <!-- Bloque Izquierdo: Buscador y Filtros -->
        <div class="d-flex flex-wrap gap-2 align-items-center">
            <!-- Buscador de texto -->
            <div class="input-group input-group-sm w-auto">
                <span class="input-group-text bg-white border-end-0"><i class="bi bi-search text-muted"></i></span>
                <input type="text" id="buscadorProductos" class="form-control border-start-0" placeholder="Buscar producto..." style="max-width: 200px;">
            </div>
            
            <!-- Select Filtro Categoría -->
            <select id="filtroCategoriaProductos" class="form-select form-select-sm w-auto" style="min-width: 150px;">
                <option value="">Todas las categorías</option>
                <!-- Se llena con JS -->
            </select>
            
            <!-- Select Filtro Stock -->
            <select id="filtroStockProductos" class="form-select form-select-sm w-auto">
                <option value="">Todos los estados</option>
                <option value="optimo">Stock Óptimo (> 10)</option>
                <option value="bajo">Stock Bajo (1 - 10)</option>
                <option value="sin">Sin Stock (0)</option>
            </select>
        </div>

        <!-- Bloque Derecho: Exportar y Contador -->
        <div class="d-flex align-items-center gap-2">
            <button class="btn btn-sm btn-outline-success d-flex align-items-center" id="btnExportarExcel">
                <i class="bi bi-file-earmark-excel me-1"></i> Excel
            </button>
            <span class="badge bg-green" id="contadorProductos">0 productos</span>
        </div>
    </div>
    
    <!-- Cuerpo de la Tabla -->
    <div class="card-body p-0">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-light">
                    <tr>
                        <th>Código</th>
                        <th>Producto</th>
                        <th class="text-end">Precio</th>
                        <th class="text-center">Stock</th>
                        <th class="text-center">Acciones</th>
                    </tr>
                </thead>
                <tbody id="listaProductosBody">
                    <!-- Se llena dinámicamente con JS -->
                </tbody>
            </table>
        </div>
    </div>
</div>

<!-- Modal Nuevo Producto -->
<div class="modal fade" id="modalNuevoProducto" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header bg-green text-white">
                <h5 class="modal-title"><i class="bi bi-plus-circle me-2"></i>Registrar Producto</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <div class="mb-3">
                    <label class="form-label">Código de Barras</label>
                    <div class="input-group">
                        <input type="text" id="codigoBarras" class="form-control" placeholder="Escanea o escribe el código">
                        <button class="btn btn-outline-green" type="button" id="btnBuscar">Buscar</button>
                    </div>
                </div>
                <div id="estadoBusqueda" class="mb-2 text-center d-none">
                    <span class="badge bg-success" id="badgeEncontrado">Producto encontrado</span>
                    <span class="badge bg-secondary" id="badgeNoEncontrado">No encontrado, ingresa manualmente</span>
                </div>
                <div id="imagenProducto" class="text-center mb-3 d-none">
                    <img src="" alt="Producto" class="img-thumbnail" style="max-height: 150px;">
                </div>
                <div class="mb-3">
                    <label class="form-label">Nombre del Producto</label>
                    <input type="text" id="nombreProducto" class="form-control" placeholder="Nombre del producto">
                </div>
                <div class="mb-3">
                    <label class="form-label">Precio de Venta (S/.)</label>
                    <input type="number" id="precioVenta" class="form-control" placeholder="0.00" step="0.01" min="0">
                </div>
                <div class="mb-3">
                    <label class="form-label">Categoría</label>
                    <select id="categoriaProducto" class="form-select">
                        <!-- Se cargarán opciones dinámicamente -->
                    </select>
                </div>
                <button class="btn btn-green w-100" id="btnGuardar" disabled>Guardar Producto</button>
            </div>
        </div>
    </div>
</div>

<!-- Modal Editar Producto -->
<div class="modal fade" id="modalEditarProducto" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header bg-warning text-dark">
                <h5 class="modal-title"><i class="bi bi-pencil-square me-2"></i>Editar Producto</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <input type="hidden" id="editProductoId">
                
                <div class="mb-3">
                    <label class="form-label">Nombre del Producto</label>
                    <input type="text" id="editNombreProducto" class="form-control">
                </div>
                <div class="mb-3">
                    <label class="form-label">Precio de Venta (S/.)</label>
                    <input type="number" id="editPrecioVenta" class="form-control" step="0.01" min="0">
                </div>
                <div class="mb-3">
                    <label class="form-label">Categoría</label>
                    <select id="editCategoriaProducto" class="form-select">
                        <!-- Se llena con JS -->
                    </select>
                </div>
                <button class="btn btn-warning w-100 fw-bold" id="btnActualizarProducto">Actualizar Producto</button>
            </div>
        </div>
    </div>
</div>

<!-- Modal Confirmar Eliminación -->
<div class="modal fade" id="modalEliminarProducto" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-sm modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header bg-danger text-white">
                <h5 class="modal-title fs-6"><i class="bi bi-exclamation-triangle-fill me-2"></i>¿Estás seguro?</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body text-center">
                <p class="mb-2">Vas a eliminar el producto:</p>
                <h6 class="fw-bold text-dark" id="deleteNombreProducto"></h6>
                
                <div class="alert alert-warning p-2 mt-3 mb-0" role="alert" style="font-size: 0.85rem;">
                    <i class="bi bi-info-circle me-1"></i> Si lo eliminas, <strong>tendrás que volver a escanearlo e introducir todos sus datos</strong> para registrarlo de nuevo.
                </div>
                <input type="hidden" id="deleteProductoId">
            </div>
            <div class="modal-footer p-2 d-flex justify-content-between">
                <button type="button" class="btn btn-sm btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                <button type="button" class="btn btn-sm btn-danger" id="btnConfirmarEliminar">Sí, eliminar</button>
            </div>
        </div>
    </div>
</div>
<!-- Fin de la plantilla productos.html. -->
