spring.datasource.url=jdbc:postgresql://aws-1-us-east-2.pooler.supabase.com:5432/postgres?sslmode=require
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

gemini.api.key.chatbot=${GEMINI_API_KEY_CHATBOT}
gemini.model.chatbot=gemini-3.1-flash-lite

gemini.api.key.ocr=${GEMINI_API_KEY_OCR}
gemini.model.ocr=gemini-3.1-flash-lite

gemini.api.key.analitica=${GEMINI_API_KEY_ANALITICA}
gemini.model.analitica=gemini-3.1-flash-lite

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

mercadopago.access.token=${MP_ACCESS_TOKEN}

sistema.pagos.proveedor-activo=mercadopago

niubiz.url.seguridad=https://apitestenv.vnforapps.com/api.security/v1/security
niubiz.url.qr=https://apitestenv.vnforapps.com/api.qr.manager/v1/qr/ascii